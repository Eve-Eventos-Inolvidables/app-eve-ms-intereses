spring.application.name=app-eve-ms-userinterests
server.port=8083

# Dirección del servidor Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Registrar usando IP en lugar del hostname
eureka.instance.prefer-ip-address=true

# Cargar credenciales (no versionado)
spring.config.import=classpath:config/private.properties,classpath:eve-common-defaults.properties

# DataSource
spring.datasource.url=${db.url}
spring.datasource.username=${db.username}
spring.datasource.password=${db.password}

# Swagger
springdoc.api-docs.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG

# Seguridad
authentication.enabled=true
jwt.algorithm=HS256
jwt.issuer=app-eve-auth
jwt.clock-skew-seconds=0
jwt.claim.roles=roles